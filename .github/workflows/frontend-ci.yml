name: Frontend CI

on:
  push:
    paths:
      - 'Front-end-with-remediation/**'
  pull_request:
    paths:
      - 'Front-end-with-remediation/**'

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./Front-end-with-remediation

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.9'
        channel: 'stable'

    - name: Install Linux system dependencies
      run: sudo apt-get update -y && sudo apt-get install -y libspeechd-dev speech-dispatcher

    - name: Fetch Dependencies
      run: flutter pub get

    - name: Analyze Layout/Code
      continue-on-error: true
      run: flutter analyze

    - name: Run Tests
      # If no tests exist it skips naturally depending on folder structure
      run: if [ -d "test" ]; then flutter test; else echo "No tests configured yet"; fi

    - name: Build Web Application
      run: flutter build web

